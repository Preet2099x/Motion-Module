; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

; Two firmwares for the same Teensy, pick one per upload:
;   pio run -t upload              bench build (src/main.cpp), driven from tools/driveCLI.py over USB
;   pio run -e robot -t upload     robot build (src/robot/main.cpp), I2C commands only
[platformio]
default_envs = teensy40

[env]
platform = teensy
board = teensy40
framework = arduino
monitor_speed = 115200

[env:teensy40]
build_src_filter = +<*> -<robot/>

[env:robot]
build_src_filter = -<*> +<robot/>
